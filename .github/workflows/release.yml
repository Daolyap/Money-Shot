name: Build and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: windows-latest

    permissions:
      contents: write  # Required for creating releases and uploading assets
      actions: read    # Required for workflow

    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0  # Fetch all history for proper versioning

    - name: Setup .NET
      uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
      with:
        dotnet-version: '10.0.x'

    - name: Extract version from project file
      id: get_version
      shell: pwsh
      run: |
        try {
          [xml]$csproj = Get-Content MoneyShot/MoneyShot.csproj
          $version = $csproj.Project.PropertyGroup.Version
          
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Version property not found in MoneyShot.csproj"
          }
          
          $buildNumber = $env:GITHUB_RUN_NUMBER
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"

          # Create version tag: v1.0.0-build.123.abc1234
          $tag = "v$version-build.$buildNumber.$shortSha"
          $releaseName = "Money Shot v$version Build $buildNumber"

          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "release_name=$releaseName" >> $env:GITHUB_OUTPUT
          echo "timestamp=$timestamp" >> $env:GITHUB_OUTPUT
        } catch {
          Write-Error "Failed to extract version: $_"
          exit 1
        }

    - name: Restore dependencies
      run: dotnet restore MoneyShot/MoneyShot.csproj

    - name: Build
      run: dotnet build MoneyShot/MoneyShot.csproj --configuration Release --no-restore /p:VersionSuffix=build.${{ github.run_number }} /p:AssemblyVersion=${{ steps.get_version.outputs.version }}.${{ github.run_number }} /p:FileVersion=${{ steps.get_version.outputs.version }}.${{ github.run_number }}

    - name: Publish (self-contained single-file)
      run: dotnet publish MoneyShot/MoneyShot.csproj --configuration Release --output ./publish --runtime win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

    - name: Create Release ZIP
      shell: pwsh
      run: |
        $zipName = "MoneyShot-v${{ steps.get_version.outputs.version }}-build.${{ github.run_number }}.zip"
        Compress-Archive -Path ./publish/* -DestinationPath $zipName
        echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

    - name: Install WiX Toolset
      run: |
        dotnet tool install --global wix --version "5.*"
        wix extension add -g WixToolset.UI.wixext/5.0.2
        wix extension add -g WixToolset.Util.wixext/5.0.2

    - name: Build MSI
      shell: pwsh
      run: |
        $msiName = "MoneyShot-v${{ steps.get_version.outputs.version }}-build.${{ github.run_number }}.msi"
        $msiVersion = "${{ steps.get_version.outputs.version }}.${{ github.run_number }}"
        wix build -arch x64 -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext `
          -d PublishDir="${{ github.workspace }}\publish" `
          -d ProductVersion=$msiVersion `
          -out $msiName `
          Installer/Product.wxs
        echo "MSI_NAME=$msiName" >> $env:GITHUB_ENV

    - name: Generate SHA256SUMS.txt
      shell: pwsh
      run: |
        # Format: "<lowercase-hex-hash>  <filename>" — matches GNU sha256sum output that the
        # in-app AutoUpdateService.ParseSha256Sums function knows how to read.
        $files = @($env:ZIP_NAME, $env:MSI_NAME) | Where-Object { Test-Path $_ }
        $lines = foreach ($file in $files) {
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $file -Leaf)"
        }
        $lines -join "`n" | Set-Content -Path SHA256SUMS.txt -NoNewline -Encoding ASCII
        Get-Content SHA256SUMS.txt

    - name: Create GitHub Release
      uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
      with:
        tag_name: ${{ steps.get_version.outputs.tag }}
        name: ${{ steps.get_version.outputs.release_name }}
        body: |
          ## 💰 Money Shot - Automated Build

          **Version:** ${{ steps.get_version.outputs.version }}
          **Build:** ${{ github.run_number }}
          **Commit:** ${{ github.sha }}
          **Date:** ${{ steps.get_version.outputs.timestamp }}

          ### 📦 Downloads

          - **MSI Installer (Recommended)**: `MoneyShot-v${{ steps.get_version.outputs.version }}-build.${{ github.run_number }}.msi`
            - Install to Program Files with shortcuts
            - Easy uninstallation via Windows Settings

          - **Portable ZIP**: `MoneyShot-v${{ steps.get_version.outputs.version }}-build.${{ github.run_number }}.zip`
            - No installation required
            - Extract and run MoneyShot.exe

          ### ✨ What's Included

          - Full screen and region capture
          - Annotation tools (shapes, text, arrows, numbers)
          - Save to clipboard and/or file
          - Global hotkeys (Print Screen, Ctrl+Print Screen)
          - System tray integration
          - Modern Windows 11 UI

          ### ⚙️ Requirements

          - Windows 10 or Windows 11
          - No additional .NET runtime required (bundled)

          ### 📝 Changes

          This is an automated build from the latest commit to the main branch.
          See [CHANGELOG.md](https://github.com/Daolyap/Money-Shot/blob/main/CHANGELOG.md) for detailed changes.
        files: |
          ${{ env.ZIP_NAME }}
          ${{ env.MSI_NAME }}
          SHA256SUMS.txt
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-release-linux:
    # Runs after build-and-release so the tag/release it creates already exists — this job attaches
    # Linux packages to that same release rather than creating a second one. Builds MoneyShot.UI
    # (the Avalonia UI; MoneyShot itself, the WPF app, is Windows-only) as .deb/.rpm/AppImage — see
    # LINUX_PORT.md Phase 2/3 and build-linux.yml (this mirrors that workflow's build+package steps
    # for the auto-release-on-push case specifically).
    needs: build-and-release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read

    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Setup .NET
      uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
      with:
        dotnet-version: '10.0.x'

    - name: Extract version from project file
      id: get_version
      run: |
        set -euo pipefail
        version=$(grep -oPm1 '(?<=<Version>)[^<]+' MoneyShot.UI/MoneyShot.UI.csproj)
        if [ -z "$version" ]; then
          echo "::error::Version property not found in MoneyShot.UI.csproj" >&2
          exit 1
        fi
        # Must exactly reproduce build-and-release's tag computation (same $version-source
        # semantics apply — MoneyShot.csproj and MoneyShot.UI.csproj carry independent <Version>
        # properties day-to-day, but the tag itself is keyed on run number + commit SHA, which are
        # identical across jobs in the same workflow run regardless of which csproj's version
        # string is embedded in it) so this job's release-asset upload targets the same tag.
        build_number="${GITHUB_RUN_NUMBER:-0}"
        short_sha="${GITHUB_SHA:0:7}"
        tag="v${version}-build.${build_number}.${short_sha}"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Restore dependencies
      run: dotnet restore MoneyShot.UI/MoneyShot.UI.csproj

    - name: Publish (self-contained linux-x64)
      run: |
        dotnet publish MoneyShot.UI/MoneyShot.UI.csproj -f net10.0 -r linux-x64 --self-contained true \
          --configuration Release -o ./publish-linux \
          /p:AssemblyVersion=${{ steps.get_version.outputs.version }}.${{ steps.get_version.outputs.build_number }} \
          /p:FileVersion=${{ steps.get_version.outputs.version }}.${{ steps.get_version.outputs.build_number }}

    - name: Install packaging tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq dpkg-dev rpm file

    - name: Build .deb
      run: |
        chmod +x Packaging/linux/build-deb.sh
        ./Packaging/linux/build-deb.sh ./publish-linux \
          "${{ steps.get_version.outputs.version }}-${{ steps.get_version.outputs.build_number }}" \
          ./MoneyShot-v${{ steps.get_version.outputs.version }}-build.${{ steps.get_version.outputs.build_number }}_amd64.deb

    - name: Build .rpm
      run: |
        chmod +x Packaging/linux/build-rpm.sh
        ./Packaging/linux/build-rpm.sh ./publish-linux \
          "${{ steps.get_version.outputs.version }}" \
          ./rpm-out \
          "${{ steps.get_version.outputs.build_number }}"
        mv ./rpm-out/*.rpm ./MoneyShot-v${{ steps.get_version.outputs.version }}-build.${{ steps.get_version.outputs.build_number }}.x86_64.rpm

    - name: Download appimagetool
      run: |
        curl -sL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x /tmp/appimagetool

    - name: Build AppImage
      run: |
        chmod +x Packaging/linux/build-appimage.sh
        cat > /tmp/appimagetool-wrapper.sh <<'EOF'
        #!/bin/bash
        exec /tmp/appimagetool --appimage-extract-and-run "$@"
        EOF
        chmod +x /tmp/appimagetool-wrapper.sh
        APPIMAGETOOL=/tmp/appimagetool-wrapper.sh ./Packaging/linux/build-appimage.sh ./publish-linux \
          "${{ steps.get_version.outputs.version }}" \
          ./MoneyShot-v${{ steps.get_version.outputs.version }}-build.${{ steps.get_version.outputs.build_number }}-x86_64.AppImage

    - name: Generate Linux SHA256SUMS.txt
      run: |
        sha256sum ./*.deb ./*.rpm ./*.AppImage | sed 's|\./||' > SHA256SUMS-linux.txt
        cat SHA256SUMS-linux.txt

    - name: Attach Linux packages to the release
      uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
      with:
        tag_name: ${{ steps.get_version.outputs.tag }}
        files: |
          ./*.deb
          ./*.rpm
          ./*.AppImage
          SHA256SUMS-linux.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
